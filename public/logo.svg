<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Latar: gradasi gelap ala AI -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Gradasi huruf K: putih ke ungu-biru (kesan AI) -->
    <linearGradient id="k" x1="150" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c7b9ff"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>

    <!-- Glow lembut -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Kotak latar membulat -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#2a2a2a" stroke-width="3"/>

  <!-- Glow di belakang huruf -->
  <circle cx="256" cy="256" r="150" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Huruf K -->
  <path d="M170 130 V382 M170 256 L318 130 M170 256 L332 382"
        stroke="url(#k)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Titik aksen (kesan node / AI) -->
  <circle cx="352" cy="150" r="18" fill="#8b7cf6"/>
  <circle cx="352" cy="150" r="30" fill="#8b7cf6" opacity="0.25"/>
</svg>
